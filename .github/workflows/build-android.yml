name: Build Android
on:
  push:
    branches: [ main ]
    paths:
      - 'app.html'
      - 'www/**'
      - 'android/**'
      - 'assets/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Sync Capacitor
        run: |
          cp -f app.html www/app.html
          cp -f app.html www/index.html
          mkdir -p www/assets
          cp -rf assets/. www/assets/
          npx cap sync android
          cp -f app.html android/app/src/main/assets/public/app.html
          cp -f app.html android/app/src/main/assets/public/index.html
          mkdir -p android/app/src/main/assets/public/assets
          cp -rf assets/. android/app/src/main/assets/public/assets/
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Android SDK
        run: |
          sudo apt-get install -y wget unzip
          CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          wget -q $CMDLINE_TOOLS_URL -O cmdline-tools.zip
          sudo mkdir -p $ANDROID_HOME/cmdline-tools
          sudo unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          sudo mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Build Release APK + AAB
        run: |
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          cd android
          chmod +x gradlew
          KEYSTORE_PATH="${GITHUB_WORKSPACE}/android/app/mirella.keystore"
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="${KEYSTORE_PATH}" \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mirella-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: mirella-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
